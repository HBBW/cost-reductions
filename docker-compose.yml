version: '3.8'

services:
  cr-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cr-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_CLIENT=mssql
      - DB_TABLE_PREFIX=CR_
      - MSSQL_HOST=10.19.25.27
      - MSSQL_PORT=1433
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=$ilver13oy
      - MSSQL_DATABASE=BMC
      - MSSQL_ENCRYPT=false
      - JWT_SECRET=abc123def456ghi789jkl012mno345pqr678stu901vwx234
      - JWT_EXPIRES=8h
    extra_hosts:
      - "host.docker.internal:host-gateway"
