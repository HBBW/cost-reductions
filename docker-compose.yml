version: '3.8'

services:
  cr-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cr-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_CLIENT=mssql
      - DB_TABLE_PREFIX=CR_
      - MSSQL_HOST=${MSSQL_HOST:-host.docker.internal}
      - MSSQL_PORT=1433
      - MSSQL_USER=${MSSQL_USER:-cr_app}
      - MSSQL_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_DATABASE=${MSSQL_DATABASE:-BMC}
      - MSSQL_ENCRYPT=false
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES=8h
    extra_hosts:
      - "host.docker.internal:host-gateway"
