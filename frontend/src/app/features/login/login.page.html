<div class="grid min-h-dvh place-items-center px-6 py-12">
  <!-- Brand + Card terpusat -->
  <div class="w-full max-w-sm fade-up">
    <!-- Brand -->
    <div class="mb-8 flex items-center justify-center gap-2.5">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-forest font-display text-sm font-bold text-paper shadow-sm shadow-forest/20">CR</div>
      <div class="leading-tight">
        <p class="font-display text-xl font-semibold tracking-tight text-ink">CR<span class="text-forest">·</span>Monitor</p>
        <p class="mlabel !text-[9.5px]">Cost Reduction Dashboard</p>
      </div>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border border-hairline bg-surface p-8 shadow-xl shadow-forest/10">
      <p class="mlabel mb-2">Selamat datang kembali</p>
      <h1 class="font-display text-2xl font-semibold tracking-tight text-ink">Masuk</h1>

      <form (submit)="submit($event)" class="mt-7 space-y-4">
        <div>
          <label for="username" class="mb-1.5 block text-sm font-medium text-ink-soft">Username</label>
          <input id="username" type="text" autocomplete="username" required class="input-base"
                 [value]="username()" (input)="username.set($any($event.target).value)" placeholder="1234"/>
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-ink-soft">Password</label>
          <div class="relative">
            <input id="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password" required class="input-base pr-10"
                   [value]="password()" (input)="password.set($any($event.target).value)" placeholder="••••••••"/>
            <button type="button" (click)="showPassword.update((v) => !v)"
                    [attr.aria-label]="showPassword() ? 'Sembunyikan password' : 'Lihat password'"
                    class="absolute inset-y-0 right-0 flex h-full w-10 items-center justify-center text-faint hover:text-ink">
              @if (showPassword()) {
                <!-- eye (visible) -->
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.25 12s3.75-6.75 9.75-6.75 9.75 6.75 9.75 6.75-3.75 6.75-9.75 6.75S2.25 12 2.25 12z"/><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/></svg>
              } @else {
                <!-- eye-off (hidden) -->
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.25 12s3.75-6.75 9.75-6.75 9.75 6.75 9.75 6.75M6.6 6.6l10.8 10.8"/><path d="M9.878 9.878A3 3 0 115.5 12a3 3 0 014.378-2.122z"/></svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="rounded-md bg-rust-tint px-3 py-2 text-sm text-rust">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-primary w-full !py-2.5" [disabled]="loading()">
          @if (loading()) { Memproses… } @else { Masuk → }
        </button>
      </form>

      <p class="mt-8 border-t border-hairline pt-4 text-xs leading-relaxed text-faint">
        Lupa akun atau perlu akses departemen lain? Hubungi MR.
      </p>
    </div>
  </div>
</div>
